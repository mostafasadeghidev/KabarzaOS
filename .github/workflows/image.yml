# ساختِ ایمیجِ تولید روی GitHub، نه روی سرور (۲.۴۰.۱).
#
# ⚠️ چرا: `docker compose up -d --build` روی خودِ سرور ۱٫۱ تا ۱٫۶ گیگ حافظه
# می‌گرفت و برنامه‌های دیگرِ همان سرور را می‌کُشت. حالا سرور فقط ایمیجِ آماده
# را می‌کشد (`docker compose pull app && docker compose up -d`).
#
# ⚠️ ترتیب: اول بررسیِ TypeScript و تست‌های واحد، بعد ساختِ ایمیج. ایمیجی که
# تست‌هایش رد شده هرگز ساخته و منتشر نمی‌شود — بررسیِ نوع که از `next build`
# بیرون آمده (SKIP_TYPECHECK) اینجا سرِ جایش است.

name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # ⚠️ بی `version`: نسخه از `packageManager` ِ package.json خوانده می‌شود. هر دو با هم
      # خطای «Multiple versions of pnpm specified» می‌دهند (اولین اجرای ۲.۴۰.۱ همین‌جا ایستاد).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm exec vitest run

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ⚠️ نامِ ایمیج باید حروفِ کوچک باشد؛ نامِ مخزن KabarzaOS است.
          images: ghcr.io/${{ github.repository_owner }}/kabarzaos
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # ⚠️ همیشه آخرین `node:22-slim` (۲.۴۴.۱): با کشِ قدیمیِ پایه، ایمیج وصلهٔ
          # امنیتیِ تازهٔ Node را نمی‌گرفت (ساختِ محلی ۲۲.۲۳.۳ داد، نه ۲۲.۲۳.۴).
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SKIP_TYPECHECK=1
          # کشِ لایه‌ها بینِ اجراها — وابستگی‌ها و لایه‌های apt فقط با تغییرشان دوباره ساخته می‌شوند.
          cache-from: type=gha
          cache-to: type=gha,mode=max
